<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis of the Last Gate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hud">
      <div class="title-wrap">
        <div class="title">Aegis of the Last Gate</div>
        <div class="subtitle">Parry • Riposte • Survive</div>
      </div>
      <div class="stats">
        <div class="stat-box">
          <span class="label">HP</span>
          <span id="health">6 / 6</span>
        </div>
        <div class="stat-box">
          <span class="label">Wave</span>
          <span id="wave">1</span>
        </div>
        <div class="stat-box">
          <span class="label">Score</span>
          <span id="score">0</span>
        </div>
      </div>
    </div>

    <canvas id="game" width="1280" height="720" aria-label="Arena game"></canvas>

    <div class="touch-controls" aria-label="Touch controls">
      <div class="dpad" aria-label="Movement">
        <button type="button" data-key="KeyW" aria-label="Move up">▲</button>
        <button type="button" data-key="KeyA" aria-label="Move left">◀</button>
        <button type="button" data-key="KeyS" aria-label="Move down">▼</button>
        <button type="button" data-key="KeyD" aria-label="Move right">▶</button>
      </div>
      <div class="action-buttons">
        <button type="button" data-action="parry">Parry</button>
        <button type="button" data-action="slash">Slash</button>
      </div>
    </div>

    <div id="message" class="message">Defend the gate. Space = parry, J = slash.</div>

    <script src="game.js"></script>
  </body>
</html>
